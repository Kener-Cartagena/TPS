# =============================================================================
# Dependabot — automated dependency updates.
#
# Once a week, GitHub checks for newer versions of the project's dependencies
# and opens pull requests into `develop` to update them. Each PR runs the full
# CI, so an update is only merged if the build and tests still pass.
#
# Minor and patch updates are grouped into ONE pull request per ecosystem to
# keep the noise low; major updates (possible breaking changes) get their own
# PR so they can be reviewed separately.
#
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# =============================================================================
version: 2

updates:
  # Maven: Spring Boot, libraries and plugins in backend/pom.xml.
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    labels: [dependencies, backend]
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions used in .github/workflows/ (actions/checkout, ...).
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    labels: [dependencies, ci]
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Base images in backend/Dockerfile (eclipse-temurin).
  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)
    labels: [dependencies, docker]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
