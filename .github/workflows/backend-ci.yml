# =============================================================================
# Backend CI — Continuous Integration for the Spring Boot backend.
#
# What it does: on every push / pull request to main or develop, GitHub starts
# fresh Linux virtual machines ("runners") and runs three independent jobs IN
# PARALLEL:
#
#   build       -> compile + all tests (`./mvnw verify`, including Testcontainers
#                  tests with a real PostgreSQL), test report, coverage report and
#                  a summary of both on the run page.
#   docker      -> builds the production Docker image (without publishing it), so a
#                  broken Dockerfile is caught in the PR, not on deployment day.
#   migrations  -> fails if a Flyway migration that was already merged is changed,
#                  or a new one is misnamed or out of order.
#
# If any job fails, the run is marked ❌ and — with branch protection enabled —
# the pull request cannot be merged.
#
# Coming in Phase 9 (CD): a `publish` job with `needs: [build, docker]` that
# pushes the image to a registry and deploys it, only after both jobs pass.
# =============================================================================

# Name shown in the GitHub "Actions" tab.
name: Backend CI

# ---- Triggers: WHEN this workflow runs ---------------------------------------
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Adds a "Run workflow" button in the Actions tab to run it manually.
  workflow_dispatch:

# ---- Security: least privilege -----------------------------------------------
# Default for every job: the automatic GITHUB_TOKEN can only read the code.
# A job that needs more asks for it explicitly (see `build` below).
permissions:
  contents: read

# ---- Concurrency: avoid wasted runs ------------------------------------------
# Runs are grouped per pull request (by number) or per branch (for pushes), so a
# PR run never shares a group with a push run on main/develop.
#   - Pull requests: pushing again cancels the old run; only the newest commit
#     matters.
#   - Pushes to main/develop: never cancelled. Every commit that lands on a
#     protected branch must be fully checked.
# (A PR run that starts after its PR was merged gets the base branch as
# github.ref; grouping by ref alone made it cancel the push run on main.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ---- Jobs: WHAT runs ---------------------------------------------------------
jobs:
  build:
    # This name is what you select as a "required status check" in branch
    # protection. Changing it means updating the protection rule too.
    name: Build and test
    runs-on: ubuntu-latest     # Free GitHub-hosted runner (Docker preinstalled)
    timeout-minutes: 15        # Kill stuck runs instead of waiting forever

    # Job-level permissions REPLACE the workflow-level ones, so `contents: read`
    # is repeated. `checks: write` lets the test reporter create a check run.
    permissions:
      contents: read
      checks: write

    defaults:
      run:
        working-directory: backend   # Every `run:` step executes inside backend/

    steps:
      # 1. Download the repository code onto the runner.
      - name: Check out code
        uses: actions/checkout@v7

      # 2. Install Java 25 (Eclipse Temurin) and cache ~/.m2 so dependencies
      #    are not downloaded from scratch on every run.
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 3. Compile, run all tests, generate the coverage report, and package.
      #    -B  = batch mode (no interactive output)
      #    -ntp = no transfer progress (cleaner logs)
      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      # 4. Publish the JUnit results as a "Test results" check on the commit /
      #    PR: how many tests passed, failed or were skipped, with details for
      #    each failure. `!cancelled()` = run even if the tests failed (that is
      #    exactly when the report is most useful), but not if the run was
      #    cancelled.
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: false

      # 5. Write a Markdown summary (tests + coverage per module) to the special file
      #    $GITHUB_STEP_SUMMARY: GitHub shows it at the top of the run's page, so
      #    the numbers are visible without downloading the reports.
      - name: Write test and coverage summary
        if: ${{ !cancelled() }}
        run: bash ../.github/scripts/backend-summary.sh >> "$GITHUB_STEP_SUMMARY"

      # 6. Keep the raw test reports (surefire) and the coverage report (JaCoCo)
      #    as downloadable "Artifacts" of the run (bottom of the run summary page).
      #    Open jacoco/index.html after downloading to browse coverage per class.
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    # Also a candidate for a required status check (see CONTRIBUTING.md).
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Buildx is Docker's modern builder; it enables the GitHub Actions cache below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds backend/Dockerfile exactly as production would, but does NOT push
      # the image anywhere (push: false). Layers are cached in GitHub's cache
      # (type=gha), so unchanged steps — like downloading Maven dependencies —
      # are reused on the next run.
      # ignore-error=true: the cache is only an optimization. Some runs (e.g. a
      # PR run that starts after its PR was merged) get a token without cache
      # write access; that must not fail a build whose image built correctly.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: tps-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  migrations:
    # Candidate for a required status check: it protects every database that already
    # ran the merged migrations (see CONTRIBUTING.md).
    name: Migration guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth: 0 downloads the whole history, not only the last commit (the
      # default), so the script can compare with the target branch or the previous
      # commit.
      - name: Check out code with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Event data is passed through environment variables, never written into the
      # script with ${{ }}: a branch name is user input, and pasting it into a shell
      # command would allow script injection.
      - name: Check Flyway migrations
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/check-migrations.sh
