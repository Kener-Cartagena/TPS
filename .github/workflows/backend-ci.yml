# =============================================================================
# Backend CI — Continuous Integration for the Spring Boot backend.
#
# What it does: on every push / pull request to main or develop, GitHub starts
# a fresh Linux virtual machine ("runner"), downloads the code, installs
# Java 25, and runs `./mvnw verify` (compile + all tests, including the
# Testcontainers tests that start a real PostgreSQL in Docker).
#
# If any step fails, the run is marked ❌ and — with branch protection enabled —
# the pull request cannot be merged.
# =============================================================================

# Name shown in the GitHub "Actions" tab.
name: Backend CI

# ---- Triggers: WHEN this workflow runs ---------------------------------------
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Adds a "Run workflow" button in the Actions tab to run it manually.
  workflow_dispatch:

# ---- Security: least privilege -----------------------------------------------
# The automatic GITHUB_TOKEN can only read the repository contents.
permissions:
  contents: read

# ---- Concurrency: avoid wasted runs ------------------------------------------
# If you push again to the same branch/PR while a run is in progress, the old
# run is cancelled and only the newest commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---- Jobs: WHAT runs ---------------------------------------------------------
jobs:
  build:
    # This name is what you select as a "required status check" in branch
    # protection. Changing it means updating the protection rule too.
    name: Build and test
    runs-on: ubuntu-latest     # Free GitHub-hosted runner (Docker preinstalled)
    timeout-minutes: 15        # Kill stuck runs instead of waiting forever

    defaults:
      run:
        working-directory: backend   # Every `run:` step executes inside backend/

    steps:
      # 1. Download the repository code onto the runner.
      - name: Check out code
        uses: actions/checkout@v7

      # 2. Install Java 25 (Eclipse Temurin) and cache ~/.m2 so dependencies
      #    are not downloaded from scratch on every run.
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 3. Compile, run all tests, and package the application.
      #    -B  = batch mode (no interactive output)
      #    -ntp = no transfer progress (cleaner logs)
      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      # 4. If something failed, upload the test reports so you can download
      #    and inspect them from the run's "Artifacts" section.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
