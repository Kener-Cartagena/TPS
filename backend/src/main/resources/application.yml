# Shared configuration for every environment.
#
# Environment-specific values live in application-<profile>.yml. Outside local
# development, the database connection is supplied through Spring Boot's
# standard environment variables (relaxed binding), never hard-coded:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# and the JWT signing key through TPS_SECURITY_JWT_SECRET (see "Security" below).

spring:
  application:
    name: tps

  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set (local development).
    default: dev

  datasource:
    hikari:
      # Named pool: easier to identify in logs and metrics.
      pool-name: tps-pool
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Keep database access inside the service layer, not in the web layer.
    open-in-view: false
    properties:
      # Store and read timestamps in UTC, regardless of the server's time zone.
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

# ---- Operations (Spring Boot Actuator) ----------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Only what a load balancer / hosting platform needs. Everything else
        # (env, beans, metrics, ...) stays private.
        include: health, info
  endpoint:
    health:
      # /actuator/health/liveness  -> is the process alive? (restart if not)
      # /actuator/health/readiness -> can it serve traffic? (includes the database)
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
      # Component details (database, disk) are hidden from anonymous callers.
      show-details: never
  info:
    # /actuator/info shows build info (name, version, time) and the Java runtime.
    java:
      enabled: true

# ---- API documentation (springdoc-openapi) -----------------------------------
springdoc:
  # Document only the public REST API, not actuator or framework endpoints.
  paths-to-match: /api/**
  # Public in every profile on purpose (portfolio demo, ADR 0004 and ADR 0005):
  # the documentation contains no data, and every operation still needs a token.
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# ---- Security (identity module, ADR 0005) -------------------------------------
tps:
  security:
    jwt:
      # Required, no default: Base64 key of at least 256 bits, from TPS_SECURITY_JWT_SECRET.
      # The application refuses to start without it. Generate: openssl rand -base64 32
      issuer: tps
      # Access token lifetime. Short on purpose: a token stays valid until it expires,
      # even if the user is disabled meanwhile (there are no refresh tokens yet).
      expiration: 30m
    login:
      # Consecutive failed logins that lock the account, and for how long.
      max-attempts: 5
      lockout: 15m
    # First administrator, created only if the database has no users. In production
    # set TPS_SECURITY_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD for the first start only.
    # bootstrap.admin: { username, password, full-name }
  # ---- Transaction engine (transactions module, ADR 0007) ----------------------
  transactions:
    # How long an operation waits for an account (or a duplicate request with the same
    # Idempotency-Key) locked by another one, before giving up with 409
    # CONCURRENT_MODIFICATION. Nothing is saved then, so the client can retry.
    lock-timeout: 5s

# ---- Logging -----------------------------------------------------------------
logging:
  pattern:
    # Adds the request id (see RequestIdFilter) to every plain-text log line.
    correlation: "[%X{requestId:-}] "
